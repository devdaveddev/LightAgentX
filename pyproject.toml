[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightagentx"
version = "0.1.0"
description = "A lightweight, modular agentic AI framework built from scratch — no LangChain, no CrewAI, no magic."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Devansh"},
]
keywords = [
    "ai",
    "agent",
    "llm",
    "framework",
    "langchain",
    "crewai",
    "openai",
    "tool-calling",
    "multi-agent",
    "react",
    "sandbox",
    "os-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-genai>=1.0.0"]
os = ["psutil>=5.9.0"]
all = ["anthropic>=0.30.0", "google-genai>=1.0.0", "psutil>=5.9.0"]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]

[project.scripts]
lightx-os = "lightagentx.smartos.cli:main"

[project.urls]
Homepage = "https://github.com/devdaveddev/LightAgentX"
Repository = "https://github.com/devdaveddev/LightAgentX"
Documentation = "https://github.com/devdaveddev/LightAgentX/blob/main/docs/guide.md"
Issues = "https://github.com/devdaveddev/LightAgentX/issues"

[tool.setuptools.packages.find]
include = ["lightagentx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
